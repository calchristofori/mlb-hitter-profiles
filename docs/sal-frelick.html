  --good: #e2475f; --mid: #4b515c; --bad: #4f80d4;
  --lhp: #e0a03a; --rhp: #4cb2bc;
  --mix1: #a9c1e3; --mix2: #6c87ad; --mix3: #3b4c66; --mixink1: #0e1014; --mixink2: #fff; --mixink3: #e8eaef;

body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 56px;

  display: grid; gap: 28px; }

/* Masthead */
.eyebrow { font: 600 12px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

.meta { display: flex; flex-wrap: wrap; gap: 8px; }

.lede { font: 400 clamp(19px, 2.3vw, 23px)/1.45 var(--prose); max-width: 46em; margin: 0; text-wrap: pretty; }
.lede p { margin: 0; }

.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 22px clamp(16px, 3vw, 28px); min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 20px; margin-bottom: 14px; }
h2 { font: 600 28px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h3 { font: 600 20px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }

.seg { display: inline-flex; background: var(--chip); border-radius: 7px; padding: 3px; gap: 2px; }
.seg button { font: 600 13px/1 var(--ui); color: var(--muted); background: transparent; border: 0; border-radius: 5px;

.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

.pgroups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 8px 44px; }

.section .prose h2 { margin-bottom: 12px; }

table { border-collapse: separate; border-spacing: 3px; width: 100%; font-variant-numeric: tabular-nums; }

.ltrack { position: relative; height: 22px; }

.lavg { position: absolute; top: 2px; bottom: 2px; width: 2px; margin-left: -1px; background: var(--muted); }
.ldot { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--paper); }
.lvals { font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

.pa-note { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
